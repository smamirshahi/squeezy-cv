name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:check
      - run: pnpm format-check
      - run: pnpm knip
      - run: pnpm test
      # Real browser: the PDF and the editor end to end (see src/e2e)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
